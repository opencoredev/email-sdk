name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Bun)
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:ci

  node:
    name: Node ${{ matrix.node }} public-package coverage
    runs-on: tenki-standard-medium-4c-8g
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs

  commonjs:
    name: CommonJS on Node ${{ matrix.node }}
    runs-on: tenki-standard-small-2c-4g
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs --require

  live-adapters:
    name: Live adapter verification
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Select changed live adapters
        id: plan
        env:
          LIVE_ADAPTERS: ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}
        run: |
          adapters="$(bun run live:plan '${{ github.event.before }}' '${{ github.sha }}')"
          echo "adapters=$adapters" >> "$GITHUB_OUTPUT"
          echo "Selected live checks: ${adapters:-none}"
      - name: Run selected non-sending authentication checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TEST_DOMAIN: ${{ secrets.RESEND_TEST_DOMAIN }}
          SEQUENZY_API_KEY: ${{ secrets.SEQUENZY_API_KEY }}
          JETEMAIL_API_KEY: ${{ secrets.JETEMAIL_API_KEY }}
          PRIMITIVE_API_KEY: ${{ secrets.PRIMITIVE_API_KEY }}
          LETTERMINT_API_TOKEN: ${{ secrets.LETTERMINT_API_TOKEN }}
          LETTR_API_KEY: ${{ secrets.LETTR_API_KEY }}
        run: bun run live:run -- "${{ steps.plan.outputs.adapters }}"
