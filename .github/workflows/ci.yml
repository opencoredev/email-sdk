name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Tenki runners only pick up jobs from this repository, so a pull request from a fork would queue
# forever. Those runs fall back to GitHub-hosted ubuntu-latest; everything else stays on Tenki.

jobs:
  verify:
    name: Verify (Bun)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-medium-4c-8g' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The docs build dates each page from its last commit (Blume
          # lastModified: "git"), which a shallow clone can't answer.
          fetch-depth: 0
      # The docs site builds with Blume, which needs Node 22.19 or later.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:ci

  convex-deploy:
    name: Convex component deploys
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-medium-4c-8g' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/convex-email
      # convex-test does not apply Convex's deploy rules, so this deploys a scratch app to a
      # local Convex backend and sends through a loopback provider fixture.
      - run: bun run convex:deploy-check
        env:
          EMAIL_SDK_TELEMETRY: "0"

  ai-compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-medium-4c-8g' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AI SDK 6 on Node 20
            node: 20
            case: ai6
          - name: Chat plus AI SDK 7 on Node 22
            node: 22
            case: chat-ai7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: bash scripts/check-ai-compatibility.sh ${{ matrix.case }}

  node:
    name: Node ${{ matrix.node }} public-package coverage
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-medium-4c-8g' }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs

  commonjs:
    name: CommonJS on Node ${{ matrix.node }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-small-2c-4g' }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@opencoredev/email-sdk
      - run: node scripts/check-node-compatibility.mjs --require

  live-adapters:
    name: Live adapter verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Select changed live adapters
        id: plan
        env:
          LIVE_ADAPTERS: ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}
          # CI has no Microsoft Graph tenant or app credentials (no MS_GRAPH_* secrets),
          # so never select the graph check here. Run `bun run live:graph` locally instead.
          LIVE_ADAPTERS_EXCLUDE: graph
        run: |
          adapters="$(bun run live:plan '${{ github.event.before }}' '${{ github.sha }}')"
          echo "adapters=$adapters" >> "$GITHUB_OUTPUT"
          echo "Selected live checks: ${adapters:-none}"
      - name: Run selected non-sending authentication checks
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TEST_DOMAIN: ${{ secrets.RESEND_TEST_DOMAIN }}
          SEQUENZY_API_KEY: ${{ secrets.SEQUENZY_API_KEY }}
          JETEMAIL_API_KEY: ${{ secrets.JETEMAIL_API_KEY }}
          PRIMITIVE_API_KEY: ${{ secrets.PRIMITIVE_API_KEY }}
          LETTERMINT_API_TOKEN: ${{ secrets.LETTERMINT_API_TOKEN }}
          LETTR_API_KEY: ${{ secrets.LETTR_API_KEY }}
        run: bun run live:run -- "${{ steps.plan.outputs.adapters }}"
